name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck mobile app
        working-directory: artifacts/saude-familiar-mobile
        run: pnpm run typecheck

      - name: Generate Android native project
        working-directory: artifacts/saude-familiar-mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: artifacts/saude-familiar-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact and checksum
        shell: bash
        run: |
          mkdir -p build-artifacts
          APK_NAME="saude-familiar-mobile-${GITHUB_SHA::7}.apk"
          cp artifacts/saude-familiar-mobile/android/app/build/outputs/apk/release/app-release.apk "build-artifacts/${APK_NAME}"
          sha256sum "build-artifacts/${APK_NAME}" > "build-artifacts/${APK_NAME}.sha256"
          ls -lh build-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saude-familiar-mobile-apk-${{ github.sha }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
